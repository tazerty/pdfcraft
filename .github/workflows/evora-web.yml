# Evora : build web de PdfCraft, futur moteur de l'Atelier de Colophon (evora.st).
#
# Écrit pour le fork tazerty/pdfcraft à partir de packaging/web/package.sh, packaging/env.sh et
# docs/releasing.md du dépôt (MIT OR Apache-2.0). Rien n'est repris de
# storytold/craft-common-actions.
#
# Règles de ce workflow :
#   - seules actions utilisées : actions/checkout, actions/cache et actions/upload-artifact,
#     épinglées par SHA de commit complet ;
#   - Rust installé par rustup en ligne de commande, version épinglée ;
#   - Trunk, wasm-bindgen, wasm-opt, cargo-deny et cargo-about : binaires de release à version
#     épinglée, vérifiés par SHA-256 avant usage ; Trunk tourne hors ligne (--offline) ;
#   - scripts de porte écrits par Evora (.github/evora/, Python de la bibliothèque standard) ;
#     test de fumée sur le Chrome préinstallé du runner, sans action tierce ;
#   - aucun secret, jeton en lecture seule.
#
# Portes BLOQUANTES (patch E1 posé) : cargo-deny (advisories, bans, licences, sources ; deny.toml de
# l'amont et exceptions d'avis nommées par Evora, vérifiées hors du graphe web) ;
# cargo-about (LICENSES/ agrégé) ; marques ArtCraft dans le bundle (0 hors LICENSES/) ; fichiers
# d'hébergement (0) ; émojis des catalogues affichés (E10) ; termes sensibles affichés après le
# catalogue de surcharge (E9) ; empreintes CSP des scripts inline ; test de fumée Chrome depuis une
# origine différente (avec et sans CSP), avec audit au rendu des émojis et des termes (E9, E10).
# Mesures imprimées : taille du .wasm (brut, .br, .gz), démarrage à froid, polices embarquées.
# Le test de fumée couvre aussi E3 (langue et thème par l'URL), E4 (pont EHP v1 avec une origine
# parente admise par evora-host.json, origine non admise ignorée ; doc.dirty : rien avant evora:open,
# puis {dirty: false} pour le document ouvert) et E5 (stockage par storageNs, purge au démarrage et
# sur evora:purge, accusé après effacement, écritures arrêtées ; hors pont, amont inchangé), avec un
# témoin sabordé (removeItem sans effet dans le moteur, evora:dirty glissé avant evora:open) qui doit
# rougir. E5 entre pages de l'origine moteur : trois moteurs du même compte dans une même page, une
# purge dans l'un n'est démentie par aucun autre (diffusion, événement storage), avec son témoin
# sabordé (BroadcastChannel inerte, aucun écouteur storage) qui doit rougir.
#
# Masquages de l'Atelier (EVORA-COL-25 ; COL-05, COL-10, OCR, hypothèse Q47 (a)) : job « masques »,
# tests natifs de pdfcraft-ui-egui dans le vrai shell (egui_kittest, AccessKit et textes dessinés),
# crates/ui-egui/tests/evora_masks.rs, sur toutes les surfaces qui listent des commandes ; et, au rendu
# du bundle, scénario de fumée « masquages » (surfaces du démarrage). Témoin sabordé (EVORA-COL-30) :
# la recette, garde enforce coupée (fonctionnalité CI evora-witness-enforce), doit rougir par ses seuls
# détecteurs (gates.py masks-witness). Paquets système du job natif :
# ceux qu'exigent egui, winit et rfd sous Linux (dépôts Ubuntu du runner) ; aucun outil tiers.
#
# Sortie : artefact de run evora-colophon-atelier-web-<tag> (archive .zip avec .br/.gz, LICENSES/
# et csp-hashes.txt ; SHA256SUMS ; BUILD-INFO.txt ; csp-hashes.txt) et artefact evora-smoke-<tag>.
# Le nom Evora n'a été pris qu'après E1 (retrait des marques ArtCraft) et le vert des portes.

name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pas de rust-toolchain(.toml) dans le dépôt au tag : stable épinglée, au moins rust-version.
  RUST_TOOLCHAIN: "1.99.0"
  RUST_MIN_VERSION: "1.95"
  # trunk-x86_64-unknown-linux-gnu.tar.gz (release v0.21.14, fichier .sha256 de la release).
  TRUNK_VERSION: "0.21.14"
  TRUNK_SHA256: "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"
  # wasm-bindgen-<v>-x86_64-unknown-linux-musl.tar.gz ; la version doit égaler celle de Cargo.lock.
  WASM_BINDGEN_VERSION: "0.2.129"
  WASM_BINDGEN_SHA256: "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e"
  # binaryen-<v>-x86_64-linux.tar.gz ; version_123 est la version par défaut de Trunk 0.21.14.
  BINARYEN_VERSION: "version_123"
  BINARYEN_SHA256: "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe"
  # cargo-deny-<v>-x86_64-unknown-linux-musl.tar.gz (empreinte relevée sur la release GitHub).
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  # cargo-about-<v>-x86_64-unknown-linux-musl.tar.gz (empreinte relevée sur la release GitHub).
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
  # Entrée de build craft-fonts au commit cité par le dépôt (docs/releasing.md, ci.yml, release.yml).
  CRAFT_FONTS_REF: "3d9ab3a132ed0eff457e424226a435a901da30d3"

jobs:
  web:
    name: Build web (wasm32)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout de la branche Evora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout de craft-fonts (commit épinglé)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: evora-ci/craft-fonts
          persist-credentials: false

      - name: Tag amont et nom de l'artefact
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            evora/*) TAG="${REF_NAME#evora/}" ;;
            *) echo "::error::branche inattendue : $REF_NAME (attendu : evora/<tag amont>)"; exit 1 ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag amont invalide : $TAG"; exit 1
          fi
          # Même lecture que packaging/env.sh : [workspace.package] version du Cargo.toml racine.
          VERSION="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") ; next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml annonce $VERSION alors que la branche vise $TAG"; exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            # Nom Evora (E1 posé et portes au vert depuis le run 38367774651) : Colophon, Atelier.
            echo "name=evora-colophon-atelier-web-$TAG"
            echo "commit=$(git rev-parse HEAD)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "report=$RUNNER_TEMP/evora-portes.md"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Evora : build web $TAG"
            echo
            echo "Commit \`$(git rev-parse HEAD)\` ; craft-fonts \`$CRAFT_FONTS_REF\`."
            echo
          } > "$RUNNER_TEMP/evora-portes.md"

      - name: Rust (rustup, version épinglée) et cible wasm32
        run: |
          set -euo pipefail
          rustup --version
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            echo "Fichier rust-toolchain présent dans le dépôt : il fait foi."
            rustup toolchain install --profile minimal
          else
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
            rustup default "$RUST_TOOLCHAIN"
          fi
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose
          cargo --version
          have="$(rustc --version | awk '{print $2}')"
          if ! printf '%s\n%s\n' "$RUST_MIN_VERSION" "$have" | sort -V -C; then
            echo "::error::rustc $have est plus ancien que rust-version $RUST_MIN_VERSION"; exit 1
          fi

      - name: Cache cargo (registre, dépôts git, target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: evora-web-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-

      - name: Outils épinglés (Trunk, wasm-bindgen, wasm-opt, cargo-deny, cargo-about ; SHA-256 vérifiés)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/evora-tools"
          mkdir -p "$TOOLS/dl" "$TOOLS/bin" "$TOOLS/trunk" "$TOOLS/wasm-bindgen" "$TOOLS/binaryen" "$TOOLS/deny" "$TOOLS/about"
          fetch() { # url sha256 destination
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            "$TRUNK_SHA256" "$TOOLS/dl/trunk.tar.gz"
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$WASM_BINDGEN_SHA256" "$TOOLS/dl/wasm-bindgen.tar.gz"
          fetch "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            "$BINARYEN_SHA256" "$TOOLS/dl/binaryen.tar.gz"
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$CARGO_DENY_SHA256" "$TOOLS/dl/cargo-deny.tar.gz"
          fetch "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$CARGO_ABOUT_SHA256" "$TOOLS/dl/cargo-about.tar.gz"
          tar -xzf "$TOOLS/dl/trunk.tar.gz" -C "$TOOLS/trunk"
          tar -xzf "$TOOLS/dl/wasm-bindgen.tar.gz" -C "$TOOLS/wasm-bindgen"
          tar -xzf "$TOOLS/dl/binaryen.tar.gz" -C "$TOOLS/binaryen"
          tar -xzf "$TOOLS/dl/cargo-deny.tar.gz" -C "$TOOLS/deny"
          tar -xzf "$TOOLS/dl/cargo-about.tar.gz" -C "$TOOLS/about"
          install -m 0755 "$(find "$TOOLS/trunk" -type f -name trunk -print -quit)" "$TOOLS/bin/trunk"
          install -m 0755 "$(find "$TOOLS/wasm-bindgen" -type f -name wasm-bindgen -print -quit)" "$TOOLS/bin/wasm-bindgen"
          install -m 0755 "$(find "$TOOLS/deny" -type f -name cargo-deny -print -quit)" "$TOOLS/bin/cargo-deny"
          install -m 0755 "$(find "$TOOLS/about" -type f -name cargo-about -print -quit)" "$TOOLS/bin/cargo-about"
          # wasm-opt reste dans l'arbre binaryen (il peut y chercher ../lib).
          WASM_OPT="$(find "$TOOLS/binaryen" -type f -name wasm-opt -print -quit)"
          [ -x "$WASM_OPT" ] || { echo "::error::wasm-opt introuvable dans l'archive binaryen"; exit 1; }
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          dirname "$WASM_OPT" >> "$GITHUB_PATH"

      - name: Vérification des versions d'outils
        run: |
          set -euo pipefail
          trunk --version
          wasm-bindgen --version
          wasm-opt --version
          cargo-deny --version
          cargo-about --version
          trunk --version | grep -qx "trunk ${TRUNK_VERSION}" || { echo "::error::version de trunk inattendue"; exit 1; }
          wasm-bindgen --version | grep -qx "wasm-bindgen ${WASM_BINDGEN_VERSION}" || { echo "::error::version de wasm-bindgen inattendue"; exit 1; }
          wasm-opt --version | grep -q "(${BINARYEN_VERSION})" || { echo "::error::version de wasm-opt inattendue"; exit 1; }
          cargo-deny --version | grep -q " ${CARGO_DENY_VERSION}\$" || { echo "::error::version de cargo-deny inattendue"; exit 1; }
          cargo-about --version | grep -q " ${CARGO_ABOUT_VERSION}\$" || { echo "::error::version de cargo-about inattendue"; exit 1; }
          lock="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          if [ "$lock" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock exige wasm-bindgen $lock, le workflow épingle $WASM_BINDGEN_VERSION"; exit 1
          fi

      - name: Dépendances cargo (Cargo.lock verrouillé)
        run: cargo fetch --locked

      - name: Porte cargo-deny (advisories, bans, licences, sources ; bloquante)
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          # deny.toml est celui de l'amont, inchangé ; s'y ajoutent les seules exceptions d'avis nommées
          # par Evora (.github/evora/deny-exceptions.toml, EVORA-COL-26), chacune refusée si sa crate
          # entre dans le graphe du build web (cargo tree, wasm32, à chaque run). Les avertissements
          # sont imprimés et comptés, jamais masqués ; une erreur arrête le job.
          python3 -I .github/evora/gates.py deny-config deny.toml .github/evora/deny-exceptions.toml \
            "$RUNNER_TEMP/deny.toml" "$REPORT" || exit 1
          set +e
          set -uo pipefail
          LOG="$RUNNER_TEMP/cargo-deny.log"
          cargo deny --log-level warn --config "$RUNNER_TEMP/deny.toml" check advisories bans licenses sources 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          # Comptage sur une copie sans codes de couleur ANSI.
          sed 's/\x1b\[[0-9;]*m//g' "$LOG" > "$LOG.txt"
          LOG="$LOG.txt"
          n_err="$(grep -c '^error\[' "$LOG" || true)"
          n_warn="$(grep -c '^warning\[' "$LOG" || true)"
          {
            echo "### Porte cargo-deny $CARGO_DENY_VERSION (bloquante)"
            echo
            echo "\`cargo deny --log-level warn check advisories bans licenses sources\` (deny.toml de l'amont et exceptions Evora) : statut **$status**, erreurs **$n_err**, avertissements **$n_warn**."
            if [ "$n_warn" -gt 0 ] || [ "$n_err" -gt 0 ]; then
              echo
              echo '```'
              grep -E '^(error|warning)\[' "$LOG" | sort | uniq -c
              echo '```'
            fi
            echo
          } >> "$REPORT"
          echo "::notice::cargo-deny : statut $status, $n_err erreur(s), $n_warn avertissement(s)"
          exit "$status"

      - name: Build web release (trunk, hors ligne)
        working-directory: apps/pdfcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/evora-ci/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          TRUNK_TOOLS_WASM_BINDGEN: ${{ env.WASM_BINDGEN_VERSION }}
          TRUNK_TOOLS_WASM_OPT: ${{ env.BINARYEN_VERSION }}
        run: trunk build --release --locked --offline

      - name: Polices craft-fonts (E6 ; commit épinglé vérifié, faces embarquées mesurées)
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          have="$(git -C evora-ci/craft-fonts rev-parse HEAD)"
          if [ "$have" != "$CRAFT_FONTS_REF" ]; then
            echo "::error::craft-fonts au commit $have, épinglé $CRAFT_FONTS_REF"; exit 1
          fi
          echo "::notice::craft-fonts au commit épinglé $have"
          python3 -I .github/evora/gates.py fonts evora-ci/craft-fonts "$REPORT"

      - name: Licences des dépendances (cargo-about ; bloquante)
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          cargo about generate --manifest-path apps/pdfcraft-web/Cargo.toml -c .github/evora/about.toml \
            --format json --frozen --fail -o "$RUNNER_TEMP/about.json"
          python3 -I .github/evora/licenses.py "$RUNNER_TEMP/about.json" "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
          n="$(python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get("crates", [])), len(d.get("licenses", [])))' "$RUNNER_TEMP/about.json")"
          {
            echo "### Licences des dépendances (cargo-about $CARGO_ABOUT_VERSION, bloquante)"
            echo
            echo "Crates du build web et textes de licence : $n ; agrégés dans \`LICENSES/THIRD-PARTY-LICENSES.txt\`."
            echo
          } >> "$REPORT"

      - name: Empaquetage du site statique
        id: pkg
        env:
          NAME: ${{ steps.meta.outputs.name }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/evora-ci/craft-fonts
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/dist/web"
          if [ ! -f "$SITE/index.html" ]; then
            echo "::error::$SITE/index.html absent après trunk build"; exit 1
          fi
          # Même contrôle que package.sh : des URL relatives, pour servir le site sous n'importe quel préfixe.
          if grep -Eq '(src|href)="/[^/]' "$SITE/index.html"; then
            echo "::error::index.html contient des URL absolues à la racine"; exit 1
          fi
          WORK="$(mktemp -d)"
          PKG="$WORK/$NAME"
          OUT="$GITHUB_WORKSPACE/evora-ci/out"
          mkdir -p "$PKG/LICENSES" "$OUT"
          cp -R "$SITE/." "$PKG/"
          # Différence voulue avec package.sh : ni _headers, ni .htaccess, ni HOSTING.md.
          # L'hébergement est celui d'Evora ; l'artefact ne doit porter aucun fichier d'hébergement.
          for f in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do
            if [ -f "$f" ]; then cp "$f" "$PKG/LICENSES/"; fi
          done
          # E1 : mention en texte simple « basé sur PdfCraft par l'équipe ArtCraft » (hors du bundle).
          cp apps/pdfcraft-web/EVORA-MENTIONS.txt "$PKG/LICENSES/MENTIONS-EVORA.txt"
          # Licences des polices craft-fonts embarquées (logique de copy_font_licences, packaging/env.sh).
          for f in "$CRAFT_FONTS_DIR"/fonts/*/OFL.txt; do
            if [ -f "$f" ]; then cp "$f" "$PKG/LICENSES/OFL-$(basename "$(dirname "$f")").txt"; fi
          done
          # Licences des dépendances Rust (cargo-about).
          cp "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" "$PKG/LICENSES/THIRD-PARTY-LICENSES.txt"
          # E4 : origines parentes admises par le pont EHP (?host=evora). Vide dans l'artefact :
          # le provisionnement d'Evora l'écrit depuis engines.json (HOST-PROTOCOL §2.3) ; vide,
          # le pont reste muet.
          printf '{"parentOrigins": []}\n' > "$PKG/evora-host.json"
          {
            echo "work=$WORK"
            echo "pkg=$PKG"
            echo "out=$OUT"
          } >> "$GITHUB_OUTPUT"

      - name: Portes du bundle (marques E1, hébergement, émojis E10, termes sensibles E9 ; bloquantes)
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py check "$PKG" "$GITHUB_WORKSPACE" "$REPORT"

      - name: Empreintes CSP, précompression et taille
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          OUT: ${{ steps.pkg.outputs.out }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          python3 -I .github/evora/gates.py csp "$PKG" "$PKG/csp-hashes.txt"
          cp "$PKG/csp-hashes.txt" "$OUT/csp-hashes.txt"
          python3 -I .github/evora/gates.py compress "$PKG"
          python3 -I .github/evora/gates.py sizes "$PKG" "$REPORT"
          {
            echo "### Empreintes CSP des scripts inline (csp-hashes.txt)"
            echo
            sed 's/^/- `/; s/$/`/' "$PKG/csp-hashes.txt"
            echo
          } >> "$REPORT"

      - name: Archive, SHA256SUMS et BUILD-INFO
        env:
          NAME: ${{ steps.meta.outputs.name }}
          EPOCH: ${{ steps.meta.outputs.epoch }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          WORK: ${{ steps.pkg.outputs.work }}
          PKG: ${{ steps.pkg.outputs.pkg }}
          OUT: ${{ steps.pkg.outputs.out }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          # Archive reproductible : dates fixées au commit, ordre trié, sans attributs étendus.
          find "$PKG" -exec touch -h -d "@$EPOCH" {} +
          (cd "$WORK" && find "$NAME" -print | LC_ALL=C sort | zip -X -9 -q -@ "$OUT/$NAME.zip")
          {
            echo "artefact: $NAME.zip"
            echo "depot: $GITHUB_REPOSITORY"
            echo "branche: $GITHUB_REF_NAME"
            echo "commit: $COMMIT"
            echo "rustc: $(rustc --version)"
            echo "trunk: $(trunk --version)"
            echo "wasm-bindgen: $(wasm-bindgen --version)"
            echo "wasm-opt: $(wasm-opt --version)"
            echo "cargo-deny: $(cargo-deny --version)"
            echo "cargo-about: $(cargo-about --version)"
            echo "craft-fonts: $CRAFT_FONTS_REF"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$OUT/BUILD-INFO.txt"
          (cd "$OUT" && sha256sum "$NAME.zip" BUILD-INFO.txt csp-hashes.txt > SHA256SUMS)
          cat "$OUT/SHA256SUMS"
          ls -l "$OUT"
          {
            echo "### Archive"
            echo
            echo "| Fichier | Octets | SHA-256 |"
            echo "|---|---|---|"
            for f in "$NAME.zip" BUILD-INFO.txt csp-hashes.txt; do
              echo "| \`$f\` | $(stat -c %s "$OUT/$f") | \`$(sha256sum "$OUT/$f" | cut -d' ' -f1)\` |"
            done
            echo
          } >> "$REPORT"

      - name: Test de fumée Chrome, origine croisée (bloquant)
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
          # E9 et E10 vérifiés au rendu : le moteur audite chaque texte dessiné (window.__evoraAudit).
          EVORA_SMOKE_QUERY: "?evora-audit=1"
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -I .github/evora/smoke.py "$PKG" "$PKG/csp-hashes.txt" "$GITHUB_WORKSPACE/evora-ci/smoke" "$REPORT"

      - name: Rapport des portes
        if: always()
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo "----- rapport des portes -----"
            cat "$REPORT"
          fi

      - name: Artefact du run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: evora-ci/out/
          if-no-files-found: error

      - name: Traces du test de fumée
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evora-smoke-${{ steps.meta.outputs.tag }}
          path: evora-ci/smoke/
          if-no-files-found: ignore

  masques:
    name: Masquages de l'Atelier (tests natifs ui-egui)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout de la branche Evora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paquets système (egui, winit, rfd sous Linux)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - name: Rust (rustup, version épinglée)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Cache cargo (registre, dépôts git, target natif)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: evora-masques-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-masques-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-

      - name: Dépendances cargo (Cargo.lock verrouillé)
        run: cargo fetch --locked

      - name: Recette des masquages (bloquante)
        env:
          # Le verdict de chaque famille s'imprime en entier (fautes nommées une à une).
          RUST_BACKTRACE: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          cargo test --locked --offline -p pdfcraft-ui-egui --test evora_masks -- --test-threads=1 --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/masques.log"

      - name: Témoin sabordé de la garde des masquages (enforce coupée ; doit rougir par ses seuls détecteurs)
        env:
          RUST_BACKTRACE: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          # EVORA-COL-30 : la même recette, compilée avec la fonctionnalité CI evora-witness-enforce (jamais
          # dans le build web), doit échouer par les seuls contrôles qui tiennent à evora::enforce (état posé
          # directement, automatisation, clic sur un champ de signature vide), aux mêmes inventaires.
          set +e
          set -uo pipefail
          cargo test --locked --offline -p pdfcraft-ui-egui --features evora-witness-enforce --test evora_masks \
            -- --test-threads=1 --nocapture > "$RUNNER_TEMP/temoin.log" 2>&1
          status=$?
          set -e
          tail -n 80 "$RUNNER_TEMP/temoin.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::témoin des masquages VERT : sans enforce, la recette ne rougit pas"
            exit 1
          fi
          python3 -I .github/evora/gates.py masks-witness "$RUNNER_TEMP/masques.log" "$RUNNER_TEMP/temoin.log"
