# Evora : exceptions à la politique cargo-deny de l'amont (deny.toml, inchangé), une par avis, avec la
# crate visée, sa raison et sa preuve. `gates.py deny-config` les fusionne dans la configuration de la
# porte et refuse (statut 1) une exception mal formée, un avis que l'amont ignore déjà (exception à
# retirer) ou une crate présente dans le graphe du build web (cargo tree, cible wasm32, à chaque run).

# Montée v0.14.0 (COL-FK-B1, 2026-10-27) : les trois exceptions d'EVORA-COL-26 (RUSTSEC-2026-0370,
# -0371, -0372 : zvariant, zbus_names, zvariant_derive) sont retirées, le deny.toml de l'amont les ignore
# désormais lui-même (la porte refuse une exception déjà ignorée par l'amont). Aucune exception Evora.
