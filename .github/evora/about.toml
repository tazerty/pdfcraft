# cargo-about (Evora) : licences des dépendances Rust du build web, agrégées dans LICENSES/.
# Liste reprise de deny.toml de l'amont (licences permissives seulement), plus les deux licences
# de police qu'il admet pour epaint_default_fonts (OFL-1.1, Ubuntu-font-1.0). Ordre = priorité de
# choix quand une crate offre une alternative (MIT OR Apache-2.0 → MIT).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
